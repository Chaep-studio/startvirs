<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — 极简任务管理</title>
  <style>
    /* ---- Reset & Base ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---- Layout ---- */
    .container { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
    }
    header h1 {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .task-count {
      font-size: 14px; color: var(--text-secondary);
      background: var(--card); padding: 4px 14px; border-radius: 20px;
      box-shadow: var(--shadow);
    }

    /* ---- Card ---- */
    .card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px;
    }
    .card-title {
      font-size: 16px; font-weight: 600; margin-bottom: 16px;
      color: var(--text-secondary);
    }

    /* ---- Form ---- */
    .task-form { display: flex; flex-direction: column; gap: 12px; }
    .form-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .form-row .input-group { flex: 1; min-width: 180px; }
    .input-group label {
      display: block; font-size: 13px; font-weight: 500;
      margin-bottom: 4px; color: var(--text-secondary);
    }
    input, select, textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit;
      background: var(--card); color: var(--text);
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    textarea { resize: vertical; min-height: 60px; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 20px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all .2s; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: .9; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-icon {
      background: transparent; border: none; cursor: pointer;
      padding: 6px; border-radius: 6px; font-size: 18px;
      transition: background .15s;
    }
    .btn-icon:hover { background: var(--bg); }

    /* ---- Filters ---- */
    .filters { display: flex; gap: 12px; flex-wrap: wrap; }
    .filters select, .filters input { width: auto; min-width: 140px; }

    /* ---- Task List ---- */
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 20px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      transition: all .2s; position: relative;
    }
    .task-item:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(99,102,241,.1); }
    .task-check {
      width: 22px; height: 22px; margin-top: 2px; cursor: pointer;
      accent-color: var(--primary); flex-shrink: 0;
    }
    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: 16px; font-weight: 600; margin-bottom: 4px;
      word-break: break-word;
    }
    .task-title.done { text-decoration: line-through; color: var(--text-secondary); }
    .task-desc {
      font-size: 14px; color: var(--text-secondary);
      white-space: pre-wrap; word-break: break-word;
    }
    .task-meta {
      display: flex; gap: 10px; align-items: center;
      margin-top: 8px; font-size: 13px; flex-wrap: wrap;
    }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 500;
    }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-in_progress { background: #dbeafe; color: #1e40af; }
    .badge-done { background: #dcfce7; color: #166534; }
    .badge-priority {
      background: #ede9fe; color: #5b21b6;
    }
    .task-time { color: var(--text-secondary); font-size: 12px; }
    .task-actions {
      display: flex; gap: 6px; flex-shrink: 0;
      opacity: 0; transition: opacity .2s;
    }
    .task-item:hover .task-actions { opacity: 1; }
    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--text-secondary);
    }
    .empty-state p { font-size: 16px; margin-top: 8px; }

    /* ---- Toast ---- */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; color: #fff; padding: 12px 24px;
      border-radius: 8px; font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity .3s, transform .3s;
      pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      .container { padding: 16px 12px; }
      .form-row .input-group { min-width: 100%; }
      .task-actions { opacity: 1; }
      header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 TaskFlow</h1>
      <span class="task-count" id="taskCount">共 0 个任务</span>
    </header>

    <!-- 添加任务 -->
    <div class="card">
      <div class="card-title">✏️ 新建任务</div>
      <form class="task-form" id="taskForm">
        <div class="form-row">
          <div class="input-group" style="flex:2">
            <label for="title">标题 *</label>
            <input type="text" id="title" placeholder="输入任务标题…" required />
          </div>
          <div class="input-group" style="flex:1">
            <label for="priority">优先级</label>
            <select id="priority">
              <option value="0">普通</option>
              <option value="1">中等</option>
              <option value="2">高</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <label for="description">描述（可选）</label>
            <textarea id="description" placeholder="任务详情…"></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">➕ 添加任务</button>
      </form>
    </div>

    <!-- 过滤 & 列表 -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <div class="card-title" style="margin-bottom:0;">📌 任务列表</div>
        <div class="filters">
          <select id="filterStatus">
            <option value="">全部状态</option>
            <option value="pending">待办</option>
            <option value="in_progress">进行中</option>
            <option value="done">已完成</option>
          </select>
          <input type="text" id="filterKeyword" placeholder="搜索任务…" />
        </div>
      </div>
      <div class="task-list" id="taskList">
        <div class="empty-state">
          <div style="font-size:48px;">📭</div>
          <p>还没有任务，创建一个吧！</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ---- API 封装 ----
    const API = {
      async request(url, options = {}) {
        const res = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '请求失败');
        return data;
      },
      getTasks(params = {}) {
        const qs = new URLSearchParams(params).toString();
        return this.request(`/api/tasks${qs ? '?' + qs : ''}`);
      },
      getTask(id) { return this.request(`/api/tasks/${id}`); },
      createTask(task) {
        return this.request('/api/tasks', {
          method: 'POST', body: JSON.stringify(task),
        });
      },
      updateTask(id, fields) {
        return this.request(`/api/tasks/${id}`, {
          method: 'PUT', body: JSON.stringify(fields),
        });
      },
      deleteTask(id) {
        return this.request(`/api/tasks/${id}`, { method: 'DELETE' });
      },
    };

    // ---- 状态管理 ----
    const state = {
      tasks: [],
      filterStatus: '',
      filterKeyword: '',
    };

    // ---- DOM 引用 ----
    const $ = (sel) => document.querySelector(sel);
    const taskList = $('#taskList');
    const taskCount = $('#taskCount');
    const toast = $('#toast');

    // ---- 渲染 ----
    function render() {
      const { tasks } = state;
      taskCount.textContent = `共 ${tasks.length} 个任务`;

      if (tasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <div style="font-size:48px;">📭</div>
            <p>${state.filterStatus || state.filterKeyword ? '没有匹配的任务' : '还没有任务，创建一个吧！'}</p>
          </div>`;
        return;
      }

      const statusLabels = {
        pending: '待办', in_progress: '进行中', done: '已完成',
      };
      const priorityLabels = { 0: '普通', 1: '中等', 2: '高' };
      const priorityEmoji = { 0: '🟢', 1: '🟡', 2: '🔴' };

      taskList.innerHTML = tasks.map(task => `
        <div class="task-item" data-id="${task.id}">
          <input type="checkbox" class="task-check" ${task.status === 'done' ? 'checked' : ''} />
          <div class="task-body">
            <div class="task-title ${task.status === 'done' ? 'done' : ''}">${escapeHtml(task.title)}</div>
            ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
            <div class="task-meta">
              <span class="badge badge-${task.status}">${statusLabels[task.status] || task.status}</span>
              <span class="badge badge-priority">${priorityEmoji[task.priority] || '🟢'} ${priorityLabels[task.priority] || '普通'}</span>
              <span class="task-time">🕐 ${task.created_at}</span>
            </div>
          </div>
          <div class="task-actions">
            <button class="btn-icon" onclick="toggleStatus(${task.id})" title="切换状态">🔁</button>
            <button class="btn-icon" onclick="deleteTask(${task.id})" title="删除" style="color:var(--danger)">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // ---- 工具 ----
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg, duration = 2000) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    // ---- 数据操作 ----
    async function loadTasks() {
      try {
        const params = {};
        if (state.filterStatus) params.status = state.filterStatus;
        if (state.filterKeyword) params.keyword = state.filterKeyword;
        const res = await API.getTasks(params);
        state.tasks = res.data;
        render();
      } catch (err) {
        showToast('❌ 加载失败：' + err.message);
      }
    }

    async function handleCreate(e) {
      e.preventDefault();
      const title = $('#title').value.trim();
      if (!title) return showToast('⚠️ 请输入任务标题');

      try {
        await API.createTask({
          title,
          description: $('#description').value.trim(),
          priority: Number($('#priority').value),
        });
        $('#title').value = '';
        $('#description').value = '';
        $('#priority').value = '0';
        showToast('✅ 任务创建成功');
        await loadTasks();
      } catch (err) {
        showToast('❌ 创建失败：' + err.message);
      }
    }

    async function toggleStatus(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      const newStatus = task.status === 'done' ? 'pending' : 'done';
      try {
        await API.updateTask(id, { status: newStatus });
        showToast(newStatus === 'done' ? '✅ 标记为已完成' : '🔄 重置为待办');
        await loadTasks();
      } catch (err) {
        showToast('❌ 更新失败：' + err.message);
      }
    }

    async function deleteTask(id) {
      if (!confirm('确定要删除该任务吗？')) return;
      try {
        await API.deleteTask(id);
        showToast('🗑️ 已删除');
        await loadTasks();
      } catch (err) {
        showToast('❌ 删除失败：' + err.message);
      }
    }

    // ---- 事件绑定 ----
    // 表单提交
    $('#taskForm').addEventListener('submit', handleCreate);

    // 过滤
    $('#filterStatus').addEventListener('change', (e) => {
      state.filterStatus = e.target.value;
      loadTasks();
    });
    let searchTimer;
    $('#filterKeyword').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.filterKeyword = e.target.value.trim();
        loadTasks();
      }, 300);
    });

    // 复选框点击切换状态（委托）
    taskList.addEventListener('change', (e) => {
      if (e.target.classList.contains('task-check')) {
        const item = e.target.closest('.task-item');
        if (item) toggleStatus(Number(item.dataset.id));
      }
    });

    // ---- 启动 ----
    loadTasks();
  </script>
</body>
</html>
